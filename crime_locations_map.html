<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crime Locations Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #132039;
      --muted: #56627a;
      --accent: #0057d8;
      --danger: #c3322b;
      --border: #dce4f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #eef3fb 0%, var(--bg) 55%, #e8effa 100%);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .title {
      margin: 0 0 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 6px 18px rgba(26, 43, 81, 0.06);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    select,
    input,
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      padding: 0.55rem 0.65rem;
      background: #fff;
      color: var(--text);
    }

    button {
      align-self: end;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    button:hover {
      filter: brightness(0.95);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
      box-shadow: 0 2px 10px rgba(26, 43, 81, 0.05);
    }

    .warn {
      color: var(--danger);
      font-size: 0.9rem;
      margin: 0.35rem 0 0.6rem;
      min-height: 1.3rem;
    }

    #map {
      width: 100%;
      height: 72vh;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #dfe8f6;
      box-shadow: 0 8px 24px rgba(26, 43, 81, 0.08);
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      #map {
        min-height: 460px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Crime Locations Map</h1>
    <p class="sub">Interactive map view for `2025-11-kenya-simulated-street.csv`</p>

    <section class="controls">
      <div class="field">
        <label for="crimeType">Crime type</label>
        <select id="crimeType">
          <option value="all">All crime types</option>
        </select>
      </div>
      <div class="field">
        <label for="searchText">Location contains</label>
        <input id="searchText" type="text" placeholder="e.g. High Street" />
      </div>
      <button id="resetBtn" type="button">Reset filters</button>
    </section>

    <section class="stats">
      <span class="chip" id="totalStat">Total rows: 0</span>
      <span class="chip" id="visibleStat">Visible rows: 0</span>
      <span class="chip" id="typeStat">Top type: -</span>
    </section>

    <p class="warn" id="message"></p>
    <div id="map" aria-label="Crime locations map"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const CSV_PATH = "data/crime/2025-11-kenya-simulated-street.csv";

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true
    }).setView([51.4545, -2.5879], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    const typeSelect = document.getElementById("crimeType");
    const searchInput = document.getElementById("searchText");
    const resetBtn = document.getElementById("resetBtn");
    const messageEl = document.getElementById("message");
    const totalStat = document.getElementById("totalStat");
    const visibleStat = document.getElementById("visibleStat");
    const typeStat = document.getElementById("typeStat");

    let rows = [];

    function parseCsvLine(line) {
      const out = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];

        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }

      out.push(cur);
      return out;
    }

    function csvToObjects(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      if (lines.length < 2) {
        return [];
      }

      const headers = parseCsvLine(lines[0]);
      return lines.slice(1).map((line) => {
        const cols = parseCsvLine(line);
        const obj = {};

        headers.forEach((key, idx) => {
          obj[key] = cols[idx] || "";
        });

        return obj;
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function updateTypeOptions() {
      const uniqueTypes = [...new Set(rows.map((r) => r["Crime type"]).filter(Boolean))].sort();
      typeSelect.innerHTML = '<option value="all">All crime types</option>';

      uniqueTypes.forEach((type) => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeSelect.appendChild(option);
      });
    }

    function render() {
      markersLayer.clearLayers();
      messageEl.textContent = "";

      const selectedType = typeSelect.value;
      const searchTerm = searchInput.value.trim().toLowerCase();

      const visible = rows.filter((r) => {
        if (selectedType !== "all" && r["Crime type"] !== selectedType) {
          return false;
        }

        if (searchTerm && !String(r.Location || "").toLowerCase().includes(searchTerm)) {
          return false;
        }

        return true;
      });

      const bounds = [];
      const typeCount = new Map();

      visible.forEach((row) => {
        const lat = Number(row.Latitude);
        const lon = Number(row.Longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
          return;
        }

        typeCount.set(row["Crime type"], (typeCount.get(row["Crime type"]) || 0) + 1);

        const popup = [
          `<strong>${escapeHtml(row["Crime type"] || "Unknown")}</strong>`,
          `<div>${escapeHtml(row.Location || "Unknown location")}</div>`,
          `<div>Month: ${escapeHtml(row.Month || "-")}</div>`,
          `<div>Outcome: ${escapeHtml(row["Last outcome category"] || "N/A")}</div>`
        ].join("");

        L.circleMarker([lat, lon], {
          radius: 5,
          fillOpacity: 0.8,
          weight: 1,
          color: "#ffffff",
          fillColor: "#0057d8"
        })
          .bindPopup(popup)
          .addTo(markersLayer);

        bounds.push([lat, lon]);
      });

      const topType = [...typeCount.entries()].sort((a, b) => b[1] - a[1])[0];

      totalStat.textContent = `Total rows: ${rows.length}`;
      visibleStat.textContent = `Visible rows: ${visible.length}`;
      typeStat.textContent = topType ? `Top type: ${topType[0]} (${topType[1]})` : "Top type: -";

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [16, 16] });
      } else {
        messageEl.textContent = "No records match your current filters.";
      }
    }

    async function init() {
      try {
        const response = await fetch(CSV_PATH);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const csvText = await response.text();
        rows = csvToObjects(csvText);

        if (rows.length === 0) {
          messageEl.textContent = "CSV loaded, but no data rows were found.";
          return;
        }

        updateTypeOptions();
        render();
      } catch (err) {
        messageEl.textContent = `Failed to load ${CSV_PATH}: ${err.message}`;
      }
    }

    typeSelect.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    resetBtn.addEventListener("click", () => {
      typeSelect.value = "all";
      searchInput.value = "";
      render();
    });

    init();
  </script>
</body>
</html>
