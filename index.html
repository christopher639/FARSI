<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>FARSI - Forensic Analysis Real-Time Security Intelligence</title>
    <meta name="description" content="FARSI: Advanced Forensic Analysis and Real-Time Security Intelligence Platform" />
    <meta name="author" content="Bundi Christopher" />
    <meta name="theme-color" content="#f8fafc" />
    
    <!-- Security Headers -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- PWA manifest disabled in preview to avoid auth-bridge CORS redirect errors -->
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="FARSI - Security Intelligence Platform" />
    <meta property="og:description" content="Forensic Analysis and Real-Time Security Intelligence Platform" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://farsi.dev" />
    
    <!-- Theme initialization script - runs before React to prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('farsi_theme_preference');
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        if (theme === 'dark') {
          root.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0a0f1a';
        } else if (theme === 'system') {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(prefersDark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').content = prefersDark ? '#0a0f1a' : '#f8fafc';
        } else {
          root.classList.add('light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
