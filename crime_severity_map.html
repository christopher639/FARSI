<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crime Severity Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #132039;
      --muted: #56627a;
      --accent: #0057d8;
      --border: #dce4f0;
      --danger: #c3322b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f0f4fb 0%, #e9f0fb 100%);
    }

    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .sub {
      margin: 0.4rem 0 1rem;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
      box-shadow: 0 8px 24px rgba(26, 43, 81, 0.06);
      margin-bottom: 0.85rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.8rem;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    select, input, button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      font-size: 0.92rem;
      color: var(--text);
      background: #fff;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 0.8rem;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.38rem 0.7rem;
      font-size: 0.85rem;
      background: #fff;
    }

    .legend {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      margin-top: 0.7rem;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .warn {
      color: var(--danger);
      min-height: 1.2rem;
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
    }

    #map {
      width: 100%;
      height: 72vh;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #dfe8f6;
      box-shadow: 0 8px 24px rgba(26, 43, 81, 0.08);
    }

    @media (max-width: 800px) {
      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Crime Severity Map</h1>
    <p class="sub">Severity-weighted map based on `2025-11-avon-and-somerset-street.csv`</p>

    <section class="panel">
      <div class="controls">
        <div class="field">
          <label for="crimeType">Crime type</label>
          <select id="crimeType">
            <option value="all">All crime types</option>
          </select>
        </div>

        <div class="field">
          <label for="minSeverity">Minimum severity (<span id="severityLabel">1</span>)</label>
          <input id="minSeverity" type="range" min="1" max="5" step="1" value="1" />
        </div>

        <button id="resetBtn" type="button">Reset filters</button>
      </div>

      <div class="chips">
        <span class="chip" id="totalStat">Total rows: 0</span>
        <span class="chip" id="visibleStat">Visible rows: 0</span>
        <span class="chip" id="avgStat">Avg severity: 0.0</span>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="swatch" style="background:#2a9d8f"></span>Low (1-2)</span>
        <span class="legend-item"><span class="swatch" style="background:#e9c46a"></span>Medium (3)</span>
        <span class="legend-item"><span class="swatch" style="background:#f4a261"></span>High (4)</span>
        <span class="legend-item"><span class="swatch" style="background:#e63946"></span>Critical (5)</span>
      </div>
    </section>

    <p class="warn" id="message"></p>
    <div id="map" aria-label="Crime severity map"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const CSV_PATH = "data/crime/2025-11-avon-and-somerset-street.csv";

    const SEVERITY_BY_TYPE = {
      "Anti-social behaviour": 2,
      "Bicycle theft": 2,
      Burglary: 4,
      "Criminal damage and arson": 3,
      Drugs: 4,
      "Other theft": 2,
      "Possession of weapons": 5,
      "Public order": 3,
      Robbery: 5,
      Shoplifting: 2,
      "Theft from the person": 3,
      "Vehicle crime": 3,
      "Violence and sexual offences": 5,
      "Other crime": 4
    };

    const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([51.4545, -2.5879], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    const typeSelect = document.getElementById("crimeType");
    const minSeverityInput = document.getElementById("minSeverity");
    const severityLabel = document.getElementById("severityLabel");
    const resetBtn = document.getElementById("resetBtn");
    const messageEl = document.getElementById("message");
    const totalStat = document.getElementById("totalStat");
    const visibleStat = document.getElementById("visibleStat");
    const avgStat = document.getElementById("avgStat");

    let rows = [];

    function parseCsvLine(line) {
      const out = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];

        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }

      out.push(cur);
      return out;
    }

    function csvToObjects(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      if (lines.length < 2) {
        return [];
      }

      const headers = parseCsvLine(lines[0]);
      return lines.slice(1).map((line) => {
        const cols = parseCsvLine(line);
        const obj = {};

        headers.forEach((key, idx) => {
          obj[key] = cols[idx] || "";
        });

        return obj;
      });
    }

    function severityForType(crimeType) {
      return SEVERITY_BY_TYPE[crimeType] || 3;
    }

    function colorForSeverity(severity) {
      if (severity >= 5) return "#e63946";
      if (severity >= 4) return "#f4a261";
      if (severity >= 3) return "#e9c46a";
      return "#2a9d8f";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function updateTypeOptions() {
      const uniqueTypes = [...new Set(rows.map((r) => r["Crime type"]).filter(Boolean))].sort();
      typeSelect.innerHTML = '<option value="all">All crime types</option>';

      uniqueTypes.forEach((type) => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeSelect.appendChild(option);
      });
    }

    function render() {
      markersLayer.clearLayers();
      messageEl.textContent = "";

      const selectedType = typeSelect.value;
      const minSeverity = Number(minSeverityInput.value);
      severityLabel.textContent = String(minSeverity);

      const visible = rows.filter((row) => {
        const crimeType = row["Crime type"];
        const severity = severityForType(crimeType);

        if (selectedType !== "all" && crimeType !== selectedType) {
          return false;
        }

        if (severity < minSeverity) {
          return false;
        }

        return true;
      });

      const bounds = [];
      let severitySum = 0;

      visible.forEach((row) => {
        const lat = Number(row.Latitude);
        const lon = Number(row.Longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
          return;
        }

        const crimeType = row["Crime type"] || "Unknown";
        const severity = severityForType(crimeType);
        severitySum += severity;

        const marker = L.circleMarker([lat, lon], {
          radius: 4 + severity,
          fillColor: colorForSeverity(severity),
          fillOpacity: 0.82,
          color: "#ffffff",
          weight: 1
        });

        const popup = [
          `<strong>${escapeHtml(crimeType)}</strong>`,
          `<div>Severity score: ${severity}</div>`,
          `<div>Location: ${escapeHtml(row.Location || "Unknown")}</div>`,
          `<div>Outcome: ${escapeHtml(row["Last outcome category"] || "N/A")}</div>`
        ].join("");

        marker.bindPopup(popup);
        marker.addTo(markersLayer);
        bounds.push([lat, lon]);
      });

      totalStat.textContent = `Total rows: ${rows.length}`;
      visibleStat.textContent = `Visible rows: ${visible.length}`;
      avgStat.textContent = `Avg severity: ${visible.length ? (severitySum / visible.length).toFixed(1) : "0.0"}`;

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [16, 16] });
      } else {
        messageEl.textContent = "No records match your current filters.";
      }
    }

    async function init() {
      try {
        const response = await fetch(CSV_PATH);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        rows = csvToObjects(await response.text());

        if (rows.length === 0) {
          messageEl.textContent = "CSV loaded, but no rows were found.";
          return;
        }

        updateTypeOptions();
        render();
      } catch (err) {
        messageEl.textContent = `Failed to load ${CSV_PATH}: ${err.message}`;
      }
    }

    typeSelect.addEventListener("change", render);
    minSeverityInput.addEventListener("input", render);
    resetBtn.addEventListener("click", () => {
      typeSelect.value = "all";
      minSeverityInput.value = "1";
      render();
    });

    init();
  </script>
</body>
</html>
